services:
  app:
    build: .
    image: note:local
    container_name: note
    restart: 'no'
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      NAS_ROOT: /nas/note
      STATE_DIR: /state
      WEB_ROOT: /app/web
      REQUIRE_NAS_MOUNT: 'true'
      SECURE_COOKIES: 'true'
    ports:
      - '127.0.0.1:8787:8787'
    networks:
      web:
        aliases: [note-app]
    volumes:
      - /mnt/note:/nas
      - ./state:/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  web:
    external: true
